# Henter KVALLM-feeden hver morgen og oppdaterer søkesiden hvis det har kommet nye episoder.
# Netlify publiserer søk.kvallm.no på nytt når dist/index.html endres.
name: Oppdater episoder

on:
  schedule:
    - cron: "0 6 * * *"   # hver dag kl. 06:00 UTC
  workflow_dispatch:      # «Run workflow»-knapp for manuell kjøring
  push:
    branches: [main]
    paths: [build.py, template.html, tags.txt, static/**, .github/workflows/oppdater.yml]

permissions:
  contents: write

concurrency: oppdater

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bygg søkesiden fra feeden
        run: python3 build.py
      - name: Lagre hvis noe er endret
        run: |
          git add dist
          if git diff --cached --quiet; then echo "Ingen endringer."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Oppdater episodeliste"
          git push
